label: "Sondage pour la date de l'Assemblée Générale 2026"
body:
  value: "<link href=\"https://fonts.googleapis.com/css?family=Montserrat\" rel=\"stylesheet\">\r\n<style type=\"text/css\">\tbody {\r\n\t\t\t           font-family: 'Montserrat', sans-serif;\r\n\t\t\t           font-size: 14px;\r\n\t\t\t       }\r\n</style>\r\n<div style=\"text-align:justify;\">\r\n\t<table class=\"table\" cellpadding=\"0\" cellspacing=\"0\" width=\"100%\">\r\n\t\t<tbody>\r\n\t\t\t<tr>\r\n\t\t\t\t<td> \r\n\t\t\t\t<p>\r\n\t\t\t\t\tNous vous proposons un sondage pour choisir la date de notre Assemblée Générale Ordinaire pour 2026 en vous rappelant que <u>cette réunion est un événement important de la vie de l'association</u> et que <font color=\"red\"><strong>votre présence y est fortement souhaitée</strong></font>. \r\n\t\t\t\t</p>\r\n\t\t\t\t<p>\r\n\t\t\t\t\tSachant qu'au Jardin de Poissy, « réunion » rime avec « partage de bonnes choses à boire et à manger », nous vous proposons comme d'habitude une auberge espagnole ! Si la date retenue est un vendredi, ce sera apéro/repas puis réunion ; si c'est un samedi, ce sera réunion puis apéro/repas. \r\n\t\t\t\t</p>\r\n\t\t\t\t<p>\r\n\t\t\t\t\tPour des raisons techniques, vous ne pouvez choisir qu'une option 😔. Si vous pouvez venir à plusieurs dates mais pas toutes, choisissez LA date que vous préférez...\r\n\t\t\t\t</p>\r\n\t\t\t\t</td>\r\n\t\t\t</tr>\r\n\t\t</tbody>\r\n\t</table>\r\n</div>\r\n"
  format: without_restriction_html
